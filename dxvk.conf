# DXVK Configuration - NFS Most Wanted (2005) Apple Silicon M1 - SMOOTHNESS OPTIMIZED
# Tuned for butter-smooth 60fps on M1 8GB - zero stutter, minimal latency

# --- D3D9 Core ---
d3d9.supportDFFormats = true
d3d9.supportX4R4G4B4 = true
d3d9.forceSamplerTypeSpecConstants = false
d3d9.floatEmulation = False
d3d9.invariantPosition = true
d3d9.cachedWriteOnlyBuffers = true
d3d9.deferSurfaceCreation = true

# --- Frame Pacing & Latency (KEY for smoothness) ---
# maxFrameLatency = 2 reduces stutter vs 1 (1 is too aggressive, causes frame drops)
d3d9.maxFrameLatency = 2
# presentInterval = 1 = VSync ON (prevents tearing, smooth on M1 ProMotion)
d3d9.presentInterval = 1
# Hard cap at 60 to match ProMotion display
d3d9.maxFrameRate = 60
dxvk.maxFrameRate = 60

# --- Memory (M1 has unified memory - give DXVK more budget) ---
# Raised from 1024 to 2048 for faster texture uploads, less hitching
d3d9.memoryBudget = 2048
d3d9.maxAvailableMemory = 4096

# --- Shader Compilation (KEY for eliminating stutter spikes) ---
# Async = compile shaders in background, no freeze when new shader encountered
dxvk.async = True
# Use ALL 8 M1 cores for shader compilation - eliminates stutter spikes
dxvk.numCompilerThreads = 4
# Enable pipeline library - reuse compiled shaders faster between frames
dxvk.enableGraphicsPipelineLibrary = False

# --- Presentation ---
# tearFree = False - avoids extra frame buffer copy latency on Metal
dxvk.tearFree = False
dxvk.transparentSkipSampleShading = true

# --- HUD (set to 1 to debug FPS if needed, else 0) ---
dxvk.hud = 0
